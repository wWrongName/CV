# HTTP ACME uses the domain A record and public TCP port 80.
acme_client wwncv https://acme-v02.api.letsencrypt.org/directory
    challenge=http retry_after_error=1h;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name wwncv.tech;
    return 301 https://wwncv.tech$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wwncv.tech;
    acme wwncv;
    ssl_certificate $acme_cert_wwncv;
    ssl_certificate_key $acme_cert_key_wwncv;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
