# Keep deep links and their query strings. Legacy site pages land in Russian.
map $request_uri $wwn_legacy_path {
    default $request_uri;
    ~^/(?<legacy_root_query>\?.*)?$ /ru$legacy_root_query;
    ~^/en(?<legacy_site_tail>(?:/|\?|$).*)$ /ru$legacy_site_tail;
    ~^/classic/en(?<legacy_classic_tail>(?:/|\?|$).*)$ /classic/ru$legacy_classic_tail;
}

# HTTP ACME uses the domain A record and public TCP port 80.
acme_client wwncv https://acme-v02.api.letsencrypt.org/directory
    challenge=http retry_after_error=1h;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name wwncv.tech;
    return 308 https://wwnsolution.com$wwn_legacy_path;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wwncv.tech;
    acme wwncv;
    ssl_certificate $acme_cert_wwncv;
    ssl_certificate_key $acme_cert_key_wwncv;

    return 308 https://wwnsolution.com$wwn_legacy_path;
}
