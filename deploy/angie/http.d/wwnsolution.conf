# Separate certificate keeps renewal of the legacy redirect independent.
acme_client wwnsolution https://acme-v02.api.letsencrypt.org/directory
    challenge=http retry_after_error=5m;

server {
    listen 80;
    listen [::]:80;
    server_name wwnsolution.com;
    return 308 https://wwnsolution.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wwnsolution.com;
    acme wwnsolution;
    ssl_certificate $acme_cert_wwnsolution;
    ssl_certificate_key $acme_cert_key_wwnsolution;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Preserve Origin on native form POSTs without exposing private URL paths.
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy strict-origin always;
    }
}
